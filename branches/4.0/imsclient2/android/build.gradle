// 指定 Node.js 路径，解决 Android Studio 中找不到 node 的问题
project.ext.react = [
    nodeExecutableAndArgs: ["/usr/local/bin/node"]
]

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// JDK 指定请使用 android/local.properties 中的 org.gradle.java.home，或在 shell 中通过 JAVA_HOME 导出后运行 Gradle。
// 在 build.gradle 中修改 JVM 是无效的（构建脚本编译阶段已在 JVM 启动时确定）。
// 如果更改了 JDK，请在命令行执行 ./gradlew --stop 然后重新运行构建以重启 Gradle 守护进程。
