
def nodePath = new File(["which", "node"].execute().text.trim())
def npxPath = new File(["which", "npx"].execute().text.trim())

project.ext.react = [
    // 使用绝对路径
    nodeExecutableAndArgs: [nodePath.absolutePath],
    command: npxPath.absolutePath,
    cliPath: "../node_modules/@react-native-community/cli/build/bin.js",
    
    // 添加环境变量
    extraPackagerArgs: ["--max-workers=4"],
    bundleConfig: "metro.config.js"
]

// 打印调试信息
println "Node路径: ${nodePath.absolutePath}"
println "NPX路径: ${npxPath.absolutePath}"
println "CLI路径存在: ${new File(project.ext.react.cliPath).exists()}"

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
